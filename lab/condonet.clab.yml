name: condonet

topology:
  defaults:
    kind: linux
    image: condonet/lab-node:day03
    network-mode: none
    sysctls:
      net.ipv6.conf.default.disable_ipv6: "1"

  nodes:
    sw:
      binds:
        - ../configs/switch/configure.sh:/condonet/configure.sh:ro
      exec:
        - /bin/sh /condonet/configure.sh
    gw:
      binds:
        - ../configs/gateway/configure.sh:/condonet/configure.sh:ro
        - ../configs/nftables:/condonet/firewall:ro
        - ../configs/dhcp/dnsmasq.conf:/condonet/dhcp.conf:ro
        - ../configs/dhcp/server.conf:/condonet/programs/dhcp.conf:ro
        - ../configs/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
        - ../configs/supervisor/start.sh:/condonet/start.sh:ro
        - ../configs/ssh/sshd_config:/condonet/ssh/sshd_config:ro
        - ../configs/ssh/start.sh:/condonet/ssh/start.sh:ro
        - ../configs/ssh/server.conf:/condonet/programs/ssh.conf:ro
      exec:
        - /bin/sh /condonet/configure.sh
        - /bin/sh /condonet/start.sh
    admin:
      group: hosts
      exec:
        - /bin/sh /condonet/configure-host.sh 10.60.10.10/24 10.60.10.1
    resident:
      group: dhcp-clients
      exec:
        - /bin/sh /condonet/configure-host.sh dhcp
    guest:
      group: dhcp-clients
      exec:
        - /bin/sh /condonet/configure-host.sh dhcp
    camera:
      group: hosts
      binds:
        - ../configs/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
        - ../configs/supervisor/start.sh:/condonet/start.sh:ro
        - ../configs/nginx/nginx.conf:/condonet/nginx.conf:ro
        - ../configs/nginx/server.conf:/condonet/programs/nginx.conf:ro
        - ../configs/nginx/camera.html:/condonet/index.html:ro
      exec:
        - /bin/sh /condonet/configure-host.sh 10.60.40.10/24 10.60.40.1
        - /bin/sh /condonet/start.sh
    svc:
      group: hosts
      binds:
        - ../configs/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
        - ../configs/supervisor/start.sh:/condonet/start.sh:ro
        - ../configs/ssh/sshd_config:/condonet/ssh/sshd_config:ro
        - ../configs/ssh/start.sh:/condonet/ssh/start.sh:ro
        - ../configs/ssh/server.conf:/condonet/programs/ssh.conf:ro
        - ../configs/nginx/nginx.conf:/condonet/nginx.conf:ro
        - ../configs/nginx/server.conf:/condonet/programs/nginx.conf:ro
        - ../configs/nginx/portal.html:/condonet/index.html:ro
        - ../configs/dns/dnsmasq.conf:/condonet/dns.conf:ro
        - ../configs/dns/server.conf:/condonet/programs/dns.conf:ro
      exec:
        - /bin/sh /condonet/configure-host.sh 10.60.50.10/24 10.60.50.1
        - /bin/sh /condonet/start.sh
    wan:
      binds:
        - ../configs/host.sh:/condonet/configure-host.sh:ro
        - ../configs/wan-http.py:/condonet/wan-http.py:ro
        - ../configs/supervisor/wan-http.conf:/condonet/programs/wan-http.conf:ro
        - ../configs/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
        - ../configs/supervisor/start.sh:/condonet/start.sh:ro
      exec:
        - /bin/sh /condonet/configure-host.sh 10.60.254.2/30
        - ip route replace 10.60.0.0/16 via 10.60.254.1 dev eth1
        - /bin/sh /condonet/start.sh

  groups:
    dhcp-clients:
      binds:
        - ../configs/host.sh:/condonet/configure-host.sh:ro
        - ../configs/dhcp/client.conf:/condonet/programs/dhcp-client.conf:ro
        - ../configs/dhcp/lease.sh:/condonet/dhcp-lease.sh:ro
        - ../configs/supervisor/supervisord.conf:/etc/supervisor/supervisord.conf:ro
        - ../configs/supervisor/start.sh:/condonet/start.sh:ro
    hosts:
      binds:
        - ../configs/host.sh:/condonet/configure-host.sh:ro

  links:
    - endpoints: ["sw:eth1", "gw:eth1"]
    - endpoints: ["sw:eth2", "admin:eth1"]
    - endpoints: ["sw:eth3", "resident:eth1"]
    - endpoints: ["sw:eth4", "guest:eth1"]
    - endpoints: ["sw:eth5", "camera:eth1"]
    - endpoints: ["sw:eth6", "svc:eth1"]
    - endpoints: ["gw:eth2", "wan:eth1"]
