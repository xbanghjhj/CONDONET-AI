port=0
interface=eth1.20
interface=eth1.30
bind-interfaces
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/condonet-dhcp.leases
log-dhcp
dhcp-range=set:resident,10.60.20.100,10.60.20.149,255.255.255.0,1h
dhcp-range=set:guest,10.60.30.100,10.60.30.149,255.255.255.0,1h
dhcp-option=tag:resident,option:router,10.60.20.1
dhcp-option=tag:guest,option:router,10.60.30.1
dhcp-option=option:dns-server,10.60.50.10
