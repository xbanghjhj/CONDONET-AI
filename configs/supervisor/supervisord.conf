[unix_http_server]
file=/run/condonet-supervisor.sock
chmod=0700

[supervisord]
pidfile=/run/condonet-supervisord.pid
logfile=/var/log/condonet-supervisord.log
childlogdir=/var/log

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/condonet-supervisor.sock

[include]
files=/condonet/programs/*.conf
