[server]
address = "127.0.0.1"
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#134C87"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F7FA"
textColor = "#13273B"
borderColor = "#CAD6E2"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1rem"
baseRadius = "8px"
font = "sans-serif"
codeFont = "monospace"
headingFontSizes = ["2rem", "1.5rem", "1.2rem"]
